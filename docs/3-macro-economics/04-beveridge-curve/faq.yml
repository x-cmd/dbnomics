id: x-dbnomics-3-macro-economics-04-beveridge-curve

data:
  - name:
      en: Beveridge curve
      cn: 贝弗里奇曲线
      es: curva de Beveridge
      ja: ベバリッジ曲線
      de: Beveridge-Kurve
    qa:
      - id: what-is-the-beveridge-curve
        question:
          en: What is the Beveridge curve?
          cn: 贝弗里奇曲线是什么？
          es: ¿Qué es la curva de Beveridge?
          ja: ベバリッジ曲線とは？
          de: Was ist die Beveridge-Kurve?
        answer:
          en: >
            It is a picture of two numbers side by side: job vacancies (posts nobody has filled) and the unemployment rate. Because the same pool of workers fills those posts, the two usually move in opposite directions — lots of vacancies with little unemployment is a boom, the reverse is a slump.
          cn: >
            它把两个数字摆在一起看：职位空缺（没人填补的岗位）和失业率。因为是同一批人在填补这些岗位，两者通常反向变动——空缺多、失业低就是繁荣，反过来就是萧条。
          es: >
            Es un gráfico con dos números uno junto al otro: las vacantes de empleo (puestos que nadie ha cubierto) y la tasa de desempleo. Como es el mismo conjunto de trabajadores el que cubre esos puestos, ambos suelen moverse en direcciones opuestas: muchas vacantes con poco desempleo es un auge, y lo contrario, una depresión.
          ja: >
            求人（誰も埋めていない求人）と失業率を並べた図。求人を埋めるのは同じ労働者たちなので、通常は逆向きに動く。求人が多く失業率が低い状態が好況、その逆が不況。
          de: >
            Sie zeigt zwei Zahlen nebeneinander: offene Stellen (Posten, die niemand besetzt hat) und die Arbeitslosenquote. Weil dieselben Arbeitskräfte diese Posten besetzen, laufen beide meist in entgegengesetzte Richtungen: viele offene Stellen bei niedriger Arbeitslosigkeit ist ein Boom, das Gegenteil ein Abschwung.
        confidence: 10
        reference:
          - docs/3-macro-economics/04-beveridge-curve/en.md
          - docs/3-macro-economics/04-beveridge-curve/cn.md

      - id: why-vacancies-and-unemployment-can-both-be-high
        question:
          en: How can job vacancies and unemployment both be high at the same time?
          cn: 招聘广告和失业率为什么能同时高？
          es: ¿Cómo pueden coexistir muchas vacantes y alto desempleo?
          ja: 求人と失業率が同時に高いのはなぜか？
          de: Wie können offene Stellen und Arbeitslosigkeit gleichzeitig hoch sein?
        answer:
          en: >
            Because the jobs on offer and the people looking for work are not the same ones. That happens when the skill, location or salary of the open post does not match the jobseeker, or when workers stop searching in the places where the jobs actually are. The pandemic produced both at once: employers posted record vacancies, while many workers had left, moved, or changed what they wanted.
          cn: >
            因为招聘的岗位和找工作的申请人并不是同一批人。当岗位的技能、地点或工资对不上求职者时（或者工人不再去真正有岗位的地方找工作），就会出现这种情况。疫情把两件事同时放大：企业挂出创纪录的岗位空缺，同时很多人已经离职、换了城市，或者换了目标。
          es: >
            Porque los puestos que se ofrecen y las personas que buscan trabajo no son los mismos. Sucede cuando la cualificación, la ubicación o el salario del puesto no encajan con quien busca, o cuando los trabajadores dejan de buscar en los sitios donde realmente están los empleos. La pandemia produjo ambos a la vez: las empresas publicaron vacantes récord mientras muchos trabajadores se habían ido, se habían mudado o habían cambiado de objetivo.
          ja: >
            募集されている仕事と求職者が同じ人ではないため。募集する職種や条件が求職者と合わないとき、あるいは、求人のある場所に実際に求職しに行く人がいなくなったときに起きる。コロナ禍では両方が同時に拡大した——企業は記録的な求人を出した一方で、多くの人が退職・転居し、求める仕事を変えた。
          de: >
            Weil die angebotenen Stellen und die Arbeitsuchenden nicht dieselben sind. Das passiert, wenn Können, Ort oder Lohn der offenen Stelle nicht zum Bewerber passen — oder wenn Arbeitslose dort nicht mehr suchen, wo die Jobs tatsächlich sind. Die Pandemie produzierte beides zugleich: Arbeitgeber stellten Rekordzahlen an offenen Stellen aus, während viele Beschäftigte gekündigt hatten, umgezogen waren oder ihre Ziele geändert hatten.
        confidence: 9
        reference:
          - docs/3-macro-economics/04-beveridge-curve/en.md
          - docs/3-macro-economics/04-beveridge-curve/cn.md

      - id: what-does-an-outward-shift-mean
        question:
          en: What does it mean when the curve shifts "outward"?
          cn: 曲线"向外移动"是什么意思？
          es: ¿Qué significa que la curva se desplace "hacia fuera"?
          ja: 曲線が「外側へ動く」とはどういうことか？
          de: Was bedeutet es, wenn sich die Kurve "nach außen" verschiebt?
        answer:
          en: >
            It means the two numbers stop fitting the old relationship: more vacancies than before come with more unemployment than before. The economy is doing more hiring but the hiring is less effective — jobs sit empty while people stay unemployed. That is the abnormal state the curve is built to detect.
          cn: >
            意思是这两个数不再符合原来的关系：比从前更多的空缺，配上了比从前更多的失业。经济体的招聘规模更大了，但招得更糟——岗位空着，人却还失业。这正是这条曲线要识别的异常状态。
          es: >
            Significa que los dos números dejan de encajar con la relación anterior: más vacantes que antes junto con más desempleo que antes. La economía contrata más, pero contratando peor: quedan puestos vacantes mientras hay personas sin trabajo. Ese es el estado anormal que la curva sirve para detectar.
          ja: >
            2 つの数字が以前の関係に合わなくなることを意味する。以前より多くの求人に、以前より多くの失業が伴う。採用は増えたが採用の効率が落ちている——仕事は空いたまま、人は失業したまま。それがこの曲線が検出すべき異常な状態。
          de: >
            Es bedeutet, dass die beiden Zahlen nicht mehr zum alten Verhältnis passen: mehr offene Stellen als zuvor, zusammen mit mehr Arbeitslosigkeit als zuvor. Die Wirtschaft stellt mehr ein, stellt aber schlechter ein: Jobs bleiben leer, während Menschen arbeitslos bleiben. Das ist genau der abnormale Zustand, den die Kurve erkennen soll.
        confidence: 9
        reference:
          - docs/3-macro-economics/04-beveridge-curve/en.md
          - docs/3-macro-economics/04-beveridge-curve/cn.md

      - id: what-happened-in-2021-2022
        question:
          en: What happened in 2021–22, when vacancies went above 7% while unemployment fell?
          cn: 2021–22 年空缺率超过 7%、失业率却在下降，是怎么回事？
          es: ¿Qué pasó en 2021–22, cuando las vacantes superaron el 7% y el desempleo bajaba?
          ja: 2021–22 年、求人が 7% を超えたのに失業率が下がったのはなぜ？
          de: Was geschah 2021–22, als die offenen Stellen über 7% lagen und die Arbeitslosigkeit zugleich sank?
        answer:
          en: >
            That is the outward shift in its clearest form. Employers were desperate for staff — vacancies above 7% — and workers were leaving or switching jobs faster than new hires could replace them, so unemployment kept falling even with all that hiring. The Great Resignation broke the matching between open posts and jobseekers, pushing the whole relationship onto a new, higher curve.
          cn: >
            这就是向外移动最清楚的样子。企业急缺人手——空缺率超过 7%——同时员工离职或跳槽的速度快到新招的人补不上，于是即便招聘这么多，失业率还是一路下降。大辞职打乱了岗位与求职者的匹配，把整条关系推到了更高的新曲线上。
          es: >
            Ese es el desplazamiento hacia fuera en su forma más clara. Las empresas necesitaban personal con urgencia —vacantes por encima del 7%— y los trabajadores se marchaban o cambiaban de empleo más rápido de lo que los reemplazos cubrían, así que el desempleo bajaba pese a tanta contratación. La Gran Renuncia rompió el emparejamiento entre vacantes y demandantes de empleo y empujó toda la relación a una curva nueva y más alta.
          ja: >
            これが外側への移動の最も明確な形。企業の人手不足が深刻で（求人 7% 超）、退職や転職する人のほうが採用で埋まる速さより速く、その結果大量採用でも失業率は下がり続けた。大離職が求人と求職者のマッチングを壊し、関係全体が新しい、より高い曲線へ押された。
          de: >
            Das ist die Verschiebung nach außen in ihrer deutlichsten Form. Die Arbeitgeber brauchten Personal dringend — offene Stellen über 7% — und Beschäftigte kündigten oder wechselten den Job schneller, als Nachbesetzungen auffielen; so sank die Arbeitslosigkeit trotz vieler Einstellungen. Der Great Resignation brach das Zusammenkommen von offenen Stellen und Arbeitssuchenden und schob den ganzen Zusammenhang auf eine neue, höhere Kurve.
        confidence: 9
        reference:
          - docs/3-macro-economics/04-beveridge-curve/en.md
          - docs/3-macro-economics/04-beveridge-curve/cn.md

      - id: will-the-curve-go-back-to-normal
        question:
          en: Will the curve return to where it was before the pandemic?
          cn: 曲线会回到疫情前的样子吗？
          es: ¿Volverá la curva a donde estaba antes de la pandemia?
          ja: 曲線はパンデミ前の状態に戻るのか？
          de: Kehrt die Kurve zu ihrem Stand vor der Pandemie zurück?
        answer:
          en: >
            Not to the old one. In 2023–24 vacancies fell without unemployment rising much — the market normalised, but along a new, higher curve rather than the pre-2020 one. That leftover outward shift is the lasting scar of the pandemic on the US labour market: matching is less efficient than it used to be, so more vacancies are needed to reach the same unemployment rate.
          cn: >
            不会回到旧的那条。2023–24 年空缺下降，失业率却没有明显上升——市场确实回归了正常，但那是沿着一条更高的新曲线，而不是回到 2020 年之前那条。剩下的那段外移，就是疫情给美国劳动力市场留下的永久疤痕：匹配效率不如从前了，所以要达到同样的失业率，需要更多的空缺。
          es: >
            No a la vieja. En 2023–24 las vacantes cayeron sin que el desempleo subiera mucho: el mercado se normalizó, pero a lo largo de una curva nueva y más alta, no de la anterior a 2020. Ese desplazamiento residual hacia fuera es la cicatriz duradera de la pandemia en el mercado laboral estadounidense: el emparejamiento es menos eficiente, así que hacen falta más vacantes para lograr la misma tasa de desempleo.
          ja: >
            古い曲線には戻らない。2023–24 年は求人が減っても失業率はほとんど上がらず、市場は正常化した——しかしそれは 2020 年以前の曲線ではなく、新しい、より高い曲線に沿っての正常化だった。この残る外側へのずれがアメリカ労働市場に残した傷跡であり、マッチングの効率が悪くなった分、同じ失業率に到達するにはより多くの求人が必要になる。
          de: >
            Nicht auf die alte. 2023–24 fielen die offenen Stellen, ohne dass die Arbeitslosigkeit deutlich stieg: Der Markt normalisierte sich, aber entlang einer neuen, höheren Kurve statt der vor 2020. Diese verbliebene Verschiebung nach außen ist die bleibende Narbe der Pandemie auf dem US-Arbeitsmarkt: Das Zusammenkommen ist weniger effizient geworden, man braucht also mehr offene Stellen für dieselbe Arbeitslosenquote.
        confidence: 8
        reference:
          - docs/3-macro-economics/04-beveridge-curve/en.md
          - docs/3-macro-economics/04-beveridge-curve/cn.md

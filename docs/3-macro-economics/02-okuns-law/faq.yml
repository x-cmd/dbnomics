id: x-dbnomics-3-macro-economics-02-okuns-law

data:
  - name:
      en: Okun's law
      cn: 奥肯定律
      es: ley de Okun
      ja: オーカンの法則
      de: Okuns Gesetz
    qa:
      - id: does-okuns-law-still-hold
        question:
          en: Does Okun's law still hold?
          cn: 奥肯定律现在还成立吗？
          es: ¿La ley de Okun sigue cumpliéndose?
          ja: オーカンの法則は今も成り立つか？
          de: Gilt Okuns Gesetz noch?
        answer:
          en: >
            In the US, yes, for 25 years. The blue cloud hugs a clean downward slope: in the 2010s, growth of 2% or more chewed through unemployment year after year, and the unemployment rate fell every year the economy grew. The two points that break the pattern are 2020 and 2021, when the lockdown switch was flipped and the labour market stopped working normally.
          cn: >
            在美国，成立，而且维持了 25 年。蓝色的点云贴着一条干净的下降斜率：2010 年代，2% 以上的增长年复一年地把失業率啃下去，经济增长的每一年失業率都在降。只有 2020 和 2021 两点打破了这个格局——那是封城开关被拨下、劳动力市场停止正常运转的两年。
          es: >
            En EE. UU., sí, durante 25 años. La nube azul se ciñe a una pendiente descendente limpia: en la década de 2010, un crecimiento del 2% o más fue consumiendo el desempleo año tras año, y la tasa de desempleo bajó cada vez que la economía creció. Los dos puntos que rompen el patrón son 2020 y 2021, cuando se apagó el interruptor del cierre y el mercado de trabajo dejó de funcionar con normalidad.
          ja: >
            米国では 25 年間成り立っている。青い点塊はきれいな右下がりの傾きに沿っている。2010 年代は 2% 以上の成長が年々失業を食い、経済が成長した年には失業率が下がった。パターンを崩すのは 2020 年と 2021 年の 2 点だけで、ロックダウンというスイッチが切られ労働市場が正常に働かなくなった年だ。
          de: >
            In den USA ja, 25 Jahre lang. Die blaue Wolke schmiegt sich an eine saubere abwärts geneigte Gerade: In den 2010ern fraß Wachstum von 2% oder mehr die Arbeitslosigkeit Jahr für Jahr auf, und die Arbeitslosenquote sank in jedem Wachstumsjahr. Nur zwei Punkte durchbrechen das Muster — 2020 und 2021, als der Lockdown-Schalter umgelegt wurde und der Arbeitsmarkt nicht mehr normal funktionierte.

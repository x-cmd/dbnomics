id: x-dbnomics-2-indicators-04-unemployment

data:
  - name:
      en: unemployment
      cn: 失业
      es: desempleo
      ja: 失業
      de: Arbeitslosigkeit
    qa:
      - id: what-is-unemployment-rate
        question:
          en: What is the unemployment rate?
          cn: 失业率是什么？
          es: ¿Qué es la tasa de desempleo?
          ja: 失業率とは？
          de: Was ist die Arbeitslosenquote?
        answer:
          en: >
            People without a job who are actively looking for one, as a share of everyone in the labour force — that is, everyone who is working or looking. Someone who has stopped looking is not counted as unemployed, which is why the number understates slack in a weak economy. It is the number people feel first, because a job is where most income starts.
          cn: >
            没有工作、而且正在积极找工作的那部分人，占劳动人口（有工作或正在找工作的所有人）的比重。已经放弃找工作的不算失业，所以经济疲软时这个数字低估了闲置劳力。这是人们最先感觉到的数字，因为大部分收入都从一份工作开始。
          es: >
            Personas sin trabajo que lo buscan activamente, como parte de la población laboral —todos los que trabajan o buscan—. Quien ha dejado de buscar no se computa desempleado, y por eso la cifra subestima el margen de holgura en una economía débil. Es el número que la gente nota primero, porque el ingreso de la mayoría empieza con un empleo.
          ja: >
            仕事がなく、そして找工作をしている人が、労働人口——働いている人と找工作をしている人の合計——に占める割合。找工作をやめた人は失業に数えないため、経済が弱いときにはこの数字は労働力の余裕を過小評価する。
          de: >
            Menschen ohne Arbeit, die aktiv nach einer suchen, als Anteil aller Erwerbstätigen — also aller, die arbeiten oder suchen. Wer die Suche aufgegeben hat, zählt nicht als arbeitslos, weshalb die Zahl in einer schwachen Wirtschaft die vorhandene Reserve unterschätzt. Es ist die Zahl, die Menschen zuerst spüren, denn die meisten Einkommen beginnen mit einem Job.
        confidence: 10
        reference:
          - docs/2-indicators/04-unemployment/en.md
          - docs/2-indicators/04-unemployment/cn.md

      - id: why-spain-vs-japan
        question:
          en: Why is Spain's unemployment around 11% while Japan's is around 2.5%?
          cn: 为什么西班牙失业率约 11%，日本只有约 2.5%？
          es: ¿Por qué el desempleo de España ronda el 11% y el de Japón el 2,5%?
          ja: スペインの失業率は約 11%、日本は約 2.5% なのはなぜ？
          de: Warum liegt Spaniens Arbeitslosigkeit bei rund 11% und Japans bei rund 2,5%?
        answer:
          en: >
            That gap is about institutions, not the business cycle: how expensive it is to fire someone, how young people get a first job, how the safety net works. Spain has been on a much higher path all along — 17.86% in 2009 and a peak of 26.09% in 2013 — while Japan has been on a low, slow-declining one since 2005. In 2025 the numbers are 11.2% for Spain against 2.5% for Japan.
          cn: >
            这个差距是"制度"造成的，不是经济周期：解雇一个人有多贵、年轻人怎么找到第一份工作、社会保障网怎么运作。西班牙一直走在高得多的轨道上——2009 年 17.86%，2013 年一度冲到 26.09%；日本则从 2005 年起走在低位缓慢下行的轨道上。2025 年这两个数字是西班牙 11.2%、日本 2.5%。
          es: >
            Esa brecha tiene que ver con las instituciones, no con el ciclo: lo caro que es despedir a alguien, cómo consiguen su primer empleo los jóvenes, cómo funciona la red de protección. España ha seguido siempre una trayectoria mucho más alta —17,86% en 2009 y un pico del 26,09% en 2013—, mientras Japón lleva desde 2005 una trayectoria baja y a la baja. En 2025 las cifras son 11,2% para España frente al 2,5% de Japón.
          ja: >
            この差は「制度」の問題であって、景気循環ではない。解雇のコストが高いか若者が最初の仕事を得る仕組み、社会保障網の仕組みが違う。スペインは最初からずっと高い軌道を歩んできた——2009 年 17.86%、2013 年には 26.09% まで上昇——に対し、日本は 2005 年から低位で緩やかに下降する軌道にある。2025 年の数字はスペイン 11.2%、日本 2.5%。
          de: >
            Diese Lücke hat mit Institutionen zu tun, nicht mit dem Konjunkturzyklus: wie teuer es ist, jemanden zu entlassen, wie junge Menschen eine erste Stelle bekommen, wie das Sicherheitsnetz funktioniert. Spanien ist von Anfang an auf einem viel höheren Pfad gelaufen — 17,86% im Jahr 2009 und ein Höchststand von 26,09% 2013 —, während Japan seit 2005 einen niedrigen, langsam fallenden Pfad nimmt. 2025 stehen 11,2% für Spanien 2,5% für Japan gegenüber.
        confidence: 9
        reference:

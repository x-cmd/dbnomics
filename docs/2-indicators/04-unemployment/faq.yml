      - id: okuns-law
        question:
          en: What is Okun's law, and what does it say?
          cn: 奥肯定律是什么？说了什么？
          es: ¿Qué es la ley de Okun y qué dice?
          ja: オーカンの法則とは何を言っているのか？
          de: Was ist das Okunsche Gesetz, und was sagt es?
        answer:
          en: >
            A rule of thumb that puts a price on unemployment: for every point of unemployment above the natural rate — the rate you would expect in a healthy economy — you lose roughly 2 points of GDP. It is not a law of nature but it has held up remarkably well in the data, and it is the reason governments care so much about the unemployment number.
          cn: >
            一条给失业标价的经验规律：失业率每高出"自然失业率"（经济健康时应有的失业率）1 个百分点，GDP 大约损失 2 个百分点。它不是自然定律，但在数据里表现得相当稳，也正因为如此，政府才如此在意失业率这个数字。
          es: >
            Una regla práctica que le pone precio al desempleo: por cada punto de desempleo por encima de la tasa natural —la que se esperaría en una economía sana— se pierden unos 2 puntos de PIB. No es una ley de la naturaleza, pero se ha cumplido con notable solidez en los datos, y por eso a los gobiernos les importa tanto la cifra del desempleo.
          ja: >
            失業に価格をつける経験則。「自然失業率」（健全な経済で想定される水準）を1ポイント上回るごとに、GDP はおよそ 2 ポイント失われる。物理法則ではないがデータではかなり安定して成り立ち、各国政府がこの数字を気にするのはそのため。
          de: >
            Eine Faustregel, die der Arbeitslosigkeit einen Preis gibt: Für jeden Punkt Arbeitslosigkeit über der natürlichen Rate — der Rate, die in einer gesunden Wirtschaft zu erwarten wäre — gehen rund 2 BIP-Punkte verloren. Kein Naturgesetz, aber in den Daten überraschend stabil; deshalb kümmern sich die Regierungen so sehr um die Arbeitslosenzahl.
        confidence: 9
        reference:
          - docs/2-indicators/04-unemployment/en.md
          - docs/2-indicators/04-unemployment/cn.md

      - id: covid-spike
        question:
          en: Why did unemployment spike in 2020, and why did it fall back so fast?
          cn: 2020 年失业率为什么飙升，又为什么这么快回落？
          es: ¿Por qué se disparó el desempleo en 2020 y por qué cayó tan rápido?
          ja: 2020 年に失業率が急上昇したのはなぜ？ なぜ戻りも早かったのか？
          de: Warum schoss die Arbeitslosigkeit 2020 hoch, und warum fiel sie so schnell zurück?
        answer:
          en: >
            The 2020 spike was the lockdowns, not a normal recession: US unemployment went from 3.67% in 2019 to 8.09% in 2020, and Spain from 15.53% to 24.79%. It came back down fast because the lockdowns were temporary and, in many places, hiring subsidies kept firms attached to their workers. By the end of the cycle labour markets were unusually tight.
          cn: >
            2020 年的跳升是封控造成的，不是普通的衰退：美国失业率从 2019 年的 3.67% 升到 2020 年的 8.09%，西班牙从 15.53% 升到 24.79%。之所以回落很快，是因为封控是暂时的，而且在很多地方，补贴让企业没有立刻裁员。到这一轮周期结束时，劳动力市场反而异常紧张。
          es: >
            El pico de 2020 fueron los confinamientos, no una recesion normal: el desempleo de EE. UU. pasó del 3,67% en 2019 al 8,09% en 2020, y el de España del 15,53% al 24,79%. Bajó rápido porque los confinamientos fueron temporales y, en muchos sitios, las ayudas mantuvo a las empresas unidas a sus trabajadores. Al final del ciclo, los mercados laborales estaban inusualmente tensos.
          ja: >
            2020 年の一時的な急上昇はロックダウンによるもので、通常の不況ではない。米国の失業率は 2019 年の 3.67% から 2020 年の 8.09% へ、スペインは 15.53% から 24.79% へ上がった。戻りが速かったのは封鎖が一時的だったことと、各地で雇用維持補助金が出て企業が従業員を手放さなかったためである。このサイクルの終盤には、労働市場は異例に逼迫していた。
          de: >
            Der Ausschlag 2020 waren die Lockdowns, keine normale Rezession: Die Arbeitslosenquote in den USA stieg von 3,67% (2019) auf 8,09% (2020), in Spanien von 15,53% auf 24,79%. Sie fiel schnell zurück, weil die Lockdowns vorüber waren und in vielen Ländern Zuschüsse die Betriebe an ihre Beschäftigten banden. Am Ende des Zyklus waren die Arbeitsmärkte ungewöhnlich eng.
        confidence: 9
        reference:
          - docs/2-indicators/04-unemployment/en.md
          - docs/2-indicators/04-unemployment/cn.md

      - id: where-is-india
        question:
          en: Why is there no line for India on the unemployment chart?
          cn: 为什么失业率图上没有印度的曲线？
          es: ¿Por qué no hay línea de India en el gráfico de desempleo?
          ja: 失業率の図にインドの線がないのはなぜ？
          de: Warum gibt es im Arbeitslosigkeitsdiagramm keine Linie für Indien?
        answer:
          en: >
            Because the IMF data behind these charts has no comparable series for India — the line would be blank, and a blank line invites the reader to misread it as zero unemployment. The same gap applies to China before 2017, which is why the Chinese line only starts there. India is a large economy whose unemployment is measured on a different definition, so the honest thing is to leave it out rather than draw a misleading line.
          cn: >
            因为这张图背后的 IMF 数据没有可比的印度序列——画出来会是一条空白线，而空白线很容易被误读成"失业率为零"。中国在 2017 年之前也是同样情况，所以中国的曲线只从 2017 年开始。印度是大经济体，但它用的是另一套统计口径，诚实的做法是把它留白，而不是画一条会误导人的线。
          es: >
            Porque los datos del FMI que hay detrás de estos gráficos no tienen una serie comparable para India — la línea saldría en blanco, y una línea en blanco invita a leerla como un desempleo cero. La misma laguna aplica a China antes de 2017, por eso su línea solo empieza ahí. India es una economía grande con una definición distinta del desempleo, así que lo honesto es dejarla fuera y no dibujar una línea engañosa.
          ja: >
            図の背後にある IMF のデータに、比較可能なインドの系列がないため。描くと空欄の線になり、空欄の線は「失業率ゼロ」と誤読されやすい。中国も同じで 2017 年まで系列がないため、線は 2017 年からしか始まらない。インドは大きな経済だが失業の定義が異なり、誤解を招く線を描かないのが誠実な対応だ。
          de: >
            Weil den IMF-Daten hinter diesen Diagrammen für Indien keine vergleichbare Serie zugrunde liegt — die Linie bliebe leer, und eine leere Linie liest man leicht als Arbeitslosigkeit von null. Dieselbe Lücke gilt für China vor 2017, weshalb dessen Linie erst dort beginnt. Indien ist eine große Volkswirtschaft mit einer anderen Definition von Arbeitslosigkeit; ehrlicher ist es, sie wegzulassen, statt eine irreführende Linie zu zeichnen.
        confidence: 8
        reference:
          - docs/2-indicators/04-unemployment/en.md
          - docs/2-indicators/04-unemployment/cn.md

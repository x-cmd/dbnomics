      - id: why-us-debt-keeps-climbing
        question:
          en: Why does the US debt keep climbing even in peacetime?
          cn: 为什么美国在和平时期债务还在涨？
          es: ¿Por qué sigue creciendo la deuda de EE. UU. incluso en tiempos de paz?
          ja: なぜアメリカの債務は平時でも増え続けるのか？
          de: Warum steigt die US-Schuldenlast selbst in Friedenszeiten weiter?
        answer:
          en: >
            Because peacetime deficits keep adding debt faster than the economy grows. The US sits above 120% of GDP and still climbing, with revenue staying flat around 17–19% of GDP while spending trends up — a structural deficit, not an emergency one.
          cn: >
            因为和平时期的赤字让债务累积得比经济增长还快。美国在 120% 以上而且还在爬升，同时财政收入一直在 GDP 的 17–19% 附近走平，支出却一路向上——这是结构性赤字，不是应急性赤字。
          es: >
            Porque los déficits en tiempos de paz suman deuda más rápido de lo que crece la economía. EE. UU. está por encima del 120% del PIB y sigue subiendo, con los ingresos estables en torno al 17–19% del PIB mientras el gasto tiende al alza — un déficit estructural, no de emergencia.
          ja: >
            平時の赤字が、経済成長より速く債務を積み上げているから。アメリカは GDP の 120% を超えて上昇中だが、歳入は 17–19% で横ばい、歳出は上へ —— 姿勢的な赤字であって、危機時の赤字ではない。
          de: >
            Weil Defizite in Friedenszeiten die Schulden schneller vermehren als die Wirtschaft wächst. Die USA liegen über 120% des BIP und steigen weiter: Die Einnahmen bleiben bei etwa 17–19% des BIP flach, während die Ausgaben tendenziell zunehmen — ein strukturelles, kein akutes Defizit.
        confidence: 8
        reference:

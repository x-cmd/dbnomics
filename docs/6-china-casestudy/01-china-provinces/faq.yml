      - id: why-dollars-not-yuan
        question:
          en: Why are the figures in US dollars? What does that do to the comparison?
          cn: 为什么用美元计价？这对比较有什么影响？
          es: ¿Por qué están las cifras en dólares? ¿Qué efecto tiene eso en la comparación?
          ja: なぜドル建てなのか。比較にどう影響するのか？
          de: Warum sind die Zahlen in Dollar? Was bewirkt das für den Vergleich?
        answer:
          en: >
            Because every province sits inside one currency area: a single yuan, a single exchange rate against the dollar. Using current US dollars puts all 31 provinces on the same ruler, so the comparison is apples to apples across provinces rather than across countries. The catch is that the conversion is at market exchange rates, which move over time — so a province's dollar figure can rise or fall without anything changing inside the province. That is why the growth chart uses real growth, which strips out price changes, and not the dollar level.
          cn: >
            因为所有省份都在同一个货币区里：同一个人民币、同样一个对美元汇率。用当前美元计价，就把 31 个省放在同一把尺子上，比的是省与省，而不是国与国。代价是按市场汇率折算，汇率本身会随时间变动——某个省的美元数字可能上涨或下跌，而省内什么都没变。这就是为什么增长图用的是实际增长（剔除了价格变动），而不是美元水平。
          es: >
            Porque todas las provincias están dentro de una única zona monetaria: un solo yuan, un solo tipo de cambio frente al dólar. Expresar las cifras en dólares actuales pone a las 31 provincias ante la misma vara, así que la comparación es entre provincias y no entre países. La contrapartida es que la conversión usa tipos de mercado, que se mueven con el tiempo: la cifra en dólares de una provincia puede subir o bajar sin que cambie nada dentro de ella. Por eso el gráfico de crecimiento usa el crecimiento real, que elimina los cambios de precios, y no el nivel en dólares.
          ja: >
            すべての省が同一の通貨圏内にあるからだ——同じ元、ドルに対する同じ為替レート。現在のドルで示せば 31 省が同じ物差しに載り、国と国ではなく省と省を比べることになる。代償は市場レート換算であること——為替は動くので、ある省のドル建ての数字は省内が何も変わらなくても上下する。だから成長のグラフは水準ではなく価格変動を除いた実質成長を使うのである。
          de: >
            Weil alle Provinzen in einer einzigen Währungszone liegen: ein Yuan, ein Wechselkurs zum Dollar. In aktuellen US-Dollar gesetzt stellt alle 31 Provinzen dasselbe Lineal — der Vergleich läuft also zwischen Provinzen, nicht zwischen Ländern. Der Haken: Die Umrechnung erfolgt zu Marktwechselkursen, die sich über die Zeit bewegen — die Dollarzahl einer Provinz kann steigen oder fallen, ohne dass sich in der Provinz etwas ändert. Deshalb nutzt das Wachstumschart reales Wachstum, das Preisbewegungen herausrechnet, und nicht das Dollarniveau.
        confidence: 9
        reference:

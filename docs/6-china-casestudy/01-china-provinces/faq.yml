      en: China provinces
      cn: 中国各省
      es: provincias chinas
      ja: 中国の省
      de: chinesische Provinzen
    qa:
      - id: hukou-or-resident
        question:
          en: Is this population the registered (hukou) count or people actually living there?
          cn: 这里的人口是户籍人口还是常住人口？
          es: ¿Es esta la población registrada (hukou) o la que realmente vive allí?
          ja: ここで示す人口は戸籍人口か、実際に住んでいる人口か？
          de: Ist das die registrierte Bevölkerung (Hukou) oder die tatsächlich ansässige?
        answer:
          en: >
            The OECD regional database carries the resident population — the people actually living in the province, counted where they sleep rather than where they hold registration papers. That matters enormously in China: millions of migrant workers live in Guangdong, Shanghai or Beijing while their hukou stays in a rural hometown inland, so a hukou-based count would show almost no net migration at all, while the resident count shows Guangdong gaining 55 million people since 2000 and Heilongjiang losing 7.6 million. Either way the ranking of provinces barely changes; the direction of the flows is what the chart captures.
          cn: >
            OECD 地区数据库用的是常住人口——实际住在该省的人，按他们睡觉的地方统计，而不是按户口本所在地。在中国这一点极其关键：数以百万计的农民工住在广东、上海、北京，户口却还在内陆老家，所以按户籍算几乎看不到人口净流动；按常住人口算，才能看到广东比 2000 年多了 5500 万人、黑龙江少了 760 万。两种口径下省份的排名几乎不变，图表捕捉的是流动的方向。
          es: >
            La base regional de la OCDE recoge la población residente — las personas que viven de verdad en la provincia, contadas donde duermen y no donde tienen el registro civil. En China esto importa muchísimo: millones de trabajadores migrantes viven en Guangdong, Shanghái o Pekín mientras su hukou sigue en un pueblo natal del interior; con un conteo por hukou casi no se vería migración neta alguna, mientras que con el conteo de residentes se ve a Guangdong ganar 55 millones de personas desde 2000 y a Heilongjiang perder 7,6 millones. En cualquier caso, el orden de las provincias apenas cambia; lo que el gráfico captura es la dirección de los flujos.
          ja: >
            OECD 地域データベースが用的是常住人口——実際にその省に住んでいる人で、戸籍のある場所ではなく寝起きする場所で数えている。中国ではこれが決定的に重要だ。数百万の農民工が広東・上海・北京に住みながら戸籍は内陸の故郷に残っている。戸籍で数えれば人口移動はほぼ見えないが、常住人口で数えれば広東が 2000 年から 5,500 万人増え、黒竜江が 760 万人減る。いずれの口径でも省順位はほぼ変わらず、グラフが捉えているのは移動の方向である。
          de: >
            Die OECD-Regionendatenbank führt die Wohnbevölkerung — die Menschen, die tatsächlich in der Provinz leben, gezählt dort, wo sie schlafen, nicht wo ihr Ausweis liegt. In China ist das entscheidend: Millionen Wanderarbeiter leben in Guangdong, Shanghai oder Peking, während ihr Hukou in einem Heimatdorf im Inland bleibt; nach Melderegister gezählt wäre praktisch keine Netzmigration zu sehen, nach Einwohnern gezählt dagegen Guangdong mit plus 55 Millionen Menschen seit 2000 und Heilongjiang mit minus 7,6 Millionen. Die Reihenfolge der Provinzen ändert sich so oder so kaum; erfasst wird die Richtung der Ströme.
        confidence: 8
        reference:
          - docs/6-china-casestudy/01-china-provinces/en.md

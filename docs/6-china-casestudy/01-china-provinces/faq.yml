      - id: why-gap-narrowed-but-not-closed
        question:
          en: If the poor provinces are catching up, why hasn't the gap closed?
          cn: 既然穷省在追赶，为什么差距还没合上？
          es: Si las provincias pobres están recuperando terreno, ¿por qué no se ha cerrado la brecha?
          ja: 貧しい省が追いかけているのに、なぜ差は埋まらないのか？
          de: Wenn die armen Provinzen aufholen, warum schließt sich die Lücke nicht?
        answer:
          en: >
            Because the coastal provinces were growing too, and they started from a much bigger base. The gap did narrow: 11.7 times between Shanghai ($3,910) and Guizhou ($335) in 2000, down to 4.3 times between Beijing ($31,723) and Gansu ($7,350) in 2024. But a rate advantage only closes a gap if the leader stands still. Beijing's per-capita GDP grew more than tenfold in dollar terms over the same period, and Guizhou's grew more than twentyfold — the poor provinces run faster without the rich ones falling behind.
          cn: >
            因为沿海省份也在长，而且它们的基数大得多。差距确实缩小了：2000 年上海（3,910 美元）对贵州（335 美元）相差 11.7 倍，2024 年北京（31,723 美元）对甘肃（7,350 美元）缩到 4.3 倍。但速度快要能追上，前提是领先者原地不动。同期北京的人均 GDP 按美元算涨了十倍以上，贵州涨了二十倍以上——穷省跑得更快，而富省并没有退步。
          es: >
            Porque las provincias costeras también crecían, y partían de una base mucho mayor. La brecha sí se estrechó: 11,7 veces entre Shanghái (3.910 dólares) y Guizhou (335) en 2000, hasta 4,3 veces entre Pekín (31.723) y Gansu (7.350) en 2024. Pero una ventaja de ritmo solo cierra una brecha si el líder se queda quieto. El PIB per cápita de Pekín se multiplicó por más de diez en dólares en el mismo periodo, y el de Guizhou por más de veinte: las provincias pobres corren más rápido sin que las ricas se queden atrás.
          ja: >
            沿海の省も成長していたし、その基数もずっと大きかったからだ。差は縮んだ——2000 年の上海（3,910 ドル）と貴州（335 ドル）の 11.7 倍から、2024 年の北京（31,723 ドル）と甘粛（7,350 ドル）の 4.3 倍へ。ただし资源优势が差を埋めるには、リーダーが立ち止まることが必要だ。同じ期間に北京の一人あたり GDP はドル建てで 10 倍以上、貴州は 20 倍以上増えている。つまり貧しい県は速く走っているが、豊かな県も後退していない。
          de: >
            Weil auch die Küstenprovinzen wuchsen — und zwar von einer viel größeren Basis aus. Die Lücke hat sich tatsächlich verengt: das 11,7-Fache zwischen Shanghai (3.910 Dollar) und Guizhou (335) im Jahr 2000, nur noch das 4,3-Fache zwischen Peking (31.723) und Gansu (7.350) im Jahr 2024. Ein Geschwindigkeitsvorteil schließt eine Lücke aber nur, wenn der Vordere stehen bleibt. Pekings BIP pro Kopf hat sich im selben Zeitraum in Dollar mehr als verfünffacht, das von Guizhou mehr als verdzwanzigfacht — die armen Provinzen laufen also schneller, ohne dass die reichen zurückfallen.
        confidence: 9
        reference:
          - docs/6-china-casestudy/01-china-provinces/en.md
          - docs/6-china-casestudy/01-china-provinces/cn.md

      - id: two-divergences
        question:
          en: The article says economic convergence runs one way and population divergence another. What does that mean in practice?
          cn: 文章说经济收敛往西北、人口分化往东南，实际是什么意思？
          es: El artículo dice que la convergencia económica va en un dirección y la divergencia demográfica en otra. ¿Qué significa eso en la práctica?
          ja: 経済的な収束は一方向、人口の分化は別方向へ向かう。実践でどういうことか？
          de: Der Artikel sagt, wirtschaftliche Konvergenz verläuft in die eine Richtung, demografische Divergenz in die andere. Was heißt das praktisch?
        answer:
          en: >
            The growth story and the migration story point in opposite directions across the country. Guizhou and Shaanxi grew 10.2% and 9.7% a year in the interior west, while Guangdong and Shanghai grew 5.9% and 5.3% on the coast. Yet the coastal provinces are where people go: Guangdong is up 55 million people since 2000, Zhejiang up 21.9 million, while Heilongjiang is down 7.6 million and Jilin down 3.4 million. The interior is converging in output per head while losing its people to the coast, which is what pulls the map apart in two directions at once.
          cn: >
            增长的故事和人口流动的故事在国土上指向相反的方向。西部内陆的贵州和陕西分别年均增长 10.2% 和 9.7%，而沿海的广东和上海只增长 5.9% 和 5.3%。可人口偏偏往沿海走：广东比 2000 年多了 5500 万人，浙江多了 2190 万，黑龙江少了 760 万，吉林少了 340 万。内陆在人均产出上收敛，同时把人口输送给沿海——这就是这张地图被朝两个方向拉扯的原因。
          es: >
            La historia del crecimiento y la de la migración apuntan en direcciones opuestas dentro del país. Guizhou y Shaanxi crecieron un 10,2% y un 9,7% anual en el interior oeste, mientras Guangdong y Shanghái crecían un 5,9% y un 5,3% en la costa. Y sin embargo la costa es adonde va la gente: Guangdong ganó 55 millones de personas desde 2000 y Zhejiang 21,9 millones, mientras Heilongjiang perdió 7,6 millones y Jilin 3,4 millones. El interior converge en producción por cabeza mientras pierde población hacia la costa, y eso es lo que tensa el mapa en dos direcciones a la vez.
          ja: >
            成長の話と移動の話は、国の中での方向が反対になっている。西部内陸の貴州と陝西は毎年 10.2% と 9.7% 伸びたのに対し、沿海の広東と上海は 5.9% と 5.3% にとどまった。それでいて人が集まるのは沿岸側だ——広東は 2000 年から 5,500 万人増、浙江省は 2,190 万人増で、黒竜江は 760 万人減、吉林は 340 万人減った。内陸は一人あたり产出で収束しながら、人口を沿岸へ送り出している。だから地図は同時に二つの向きに引き裂かれている。
          de: >
            Die Wachstumsgeschichte und die Migrationsgeschichte zeigen in entgegengesetzte Richtungen. Guizhou und Shaanxi wuchsen im Westen des Landes mit 10,2% bzw. 9,7% pro Jahr, Guangdong und Shanghai an der Küste dagegen nur mit 5,9% und 5,3%. Und doch ist die Küste der Ort, an den die Menschen gehen: Guangdong hat seit 2000 55 Millionen Menschen mehr, Zhejiang 21,9 Millionen mehr, während Heilongjiang 7,6 Millionen und Jilin 3,4 Millionen verloren. Das Innere holt beim Output pro Kopf auf und verliert zugleich seine Bevölkerung an die Küste — daher wird die Karte in zwei Richtungen auseinandergezogen.
        confidence: 9
        reference:

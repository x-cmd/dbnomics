      - id: what-does-negative-correlation-mean
        question:
          en: What does the correlation of −0.65 actually mean?
          cn: 相关系数 −0.65 到底说明什么？
          es: ¿Qué significa realmente la correlación de −0,65?
          ja: 相関係数 −0.65 とは具体的にどういうことか？
          de: Was bedeutet die Korrelation von −0,65 genau?
        answer:
          en: >
            It means the lower a province started, the faster it grew. A correlation of −0.65 is strong but not perfect: it says the relationship is clearly there across the 31 provinces, while leaving room for exceptions. The extremes are visible in the chart — Guizhou started at $335 per person and grew 10.2% a year, while Guangdong started at $1,785 and grew 5.9%. Convergence in growth is therefore a real pattern here, not a slogan.
          cn: >
            意思是：一个省的起点越低，它增长得越快。−0.65 是一个强但并不完美的相关——说明这 31 个省的关系确实存在，同时留有例外的空间。极端值在图上看得一清二楚：贵州 2000 年人均 335 美元，年均增长 10.2%；广东起点 1,785 美元，年均增长 5.9%。所以这里的"增长收敛"是真实存在的模式，不是一句口号。
          es: >
            Significa que cuanto más bajo empezó una provincia, más rápido creció. Una correlación de −0,65 es fuerte pero no perfecta: la relación está claramente ahí entre las 31 provincias, dejando sitio para excepciones. Los extremos se ven en el gráfico: Guizhou partía de 335 dólares por persona y crecía un 10,2% anual, mientras Guangdong partía de 1.785 y crecía un 5,9%. La convergencia en el crecimiento es, por tanto, un patrón real, no un eslogan.
          ja: >
            一つの省の出発点が低いほど、成長が速かったという意味である。相関係数 −0.65 は強いが完全な関係ではない——31 省全体にその関係がはっきり存在し、此同时で例外の余地も残ることを示す。両端はグラフに明確に出ている——貴州は 2000 年に一人あたり 335 ドルから始まり毎年 10.2% 成長し、広東は 1,785 ドルから始めて毎年 5.9% だった。したがってここでの「成長の収束」は実際のパターンであって、口號ではない。
          de: >
            Es bedeutet: Je niedriger eine Provinz startete, desto schneller wuchs sie. Eine Korrelation von −0,65 ist stark, aber nicht perfekt — die Beziehung besteht über alle 31 Provinzen hinweg klar und lässt zugleich Raum für Ausnahmen. Die Extreme sind im Diagramm sichtbar: Guizhou startete bei 335 Dollar pro Kopf und wuchs mit 10,2% pro Jahr, Guangdong startete bei 1.785 Dollar und wuchs mit 5,9%. Die Konvergenz im Wachstum ist hier also ein reales Muster, kein Schlagwort.
        confidence: 9
        reference:

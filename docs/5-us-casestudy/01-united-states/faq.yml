      - id: what-is-the-exorbitant-privilege
        question:
          en: What is the "exorbitant privilege" and what does the ~3% deficit buy?
          cn: 什么是「过度特权」？常年 3% 的逆差换来了什么？
          es: ¿Qué es el "privilegio exagerado" y qué compra el déficit del ~3%?
          ja: 「過剰な特権」とは何か？GDP 比約 3% の赤字は何买到のか？
          de: Was ist das "exorbitante Privileg" und was bringt das Defizit von ~3%?
        answer:
          en: >
            A country that can borrow forever in a currency it issues itself pays a lower interest rate than anyone else, and that saving is the privilege. The US runs a persistent current-account deficit of about 3% of GDP — in the 2025 chart it is −3.1%, against surpluses of 6.4% for Germany and 7.6% for Switzerland. In plain terms: the rest of the world is willing to lend America money in dollars, and in return America gets cheap financing plus the demand for its exports. No other country can do this, which is why the page calls the dollar system the foundation.
          cn: >
            一个能永远用自己发行的货币借钱的国家，付的利息比谁都低，这笔省下来的钱就是「特权」。美国常年保持约占 GDP 3% 的经常账户逆差——2025 年图上是 −3.1%，对照德国 6.4% 的顺差和瑞士 7.6% 的顺差。说白了：世界愿意用美元借钱给美国，作为交换，美国拿到了低成本融资加上对本国出口的需求。没有第二个国家能做到，所以这一页说美元体系是这一切的地基。
          es: >
            Un país que puede pedir prestado indefinidamente en una moneda que él mismo emite paga un interés menor que nadie, y ese ahorro es el privilegio. EE. UU. mantiene un déficit persistente en cuenta corriente de alrededor del 3% del PIB — en el gráfico de 2025 es −3,1%, frente a superávits del 6,4% de Alemania y del 7,6% de Suiza. En lenguaje llano: el resto del mundo está dispuesto a prestarle dinero a América en dólares, y a cambio América obtiene financiación barata más demanda para sus exportaciones. Ningún otro país puede hacer esto, y por eso la página llama al sistema del dólar la base de todo.
          ja: >
            自分が発行する通貨で無限に借りられる国は、誰より低い金利で資金調達できる。その節約分が「特権」である。米国は GDP の約 3% に達する経常収支赤字を抱え続け、2025 年の図では −3.1%——同じ図でドイツの黒字は 6.4%、スイスの黒字は 7.6% だった。要するに、世界はドルでアメリカに資金を貸すことを受け入れ、その代わりにアメリカは安い資金調達と自国輸出国への需要を得る。他の国にはこれができない。だからこのページはドル体制を土台と呼ぶ。
          de: >
            Ein Land, das unbegrenzt in einer selbst emittierten Währung aufnehmen kann, zahlt einen niedrigeren Zins als alle anderen, und diese Ersparnis ist das Privileg. Die USA fahren dauerhaft ein Defizit in der Leistungsbilanz von rund 3% des BIP — im Diagramm für 2025 sind es −3,1%, gegenüber Überschüssen von 6,4% für Deutschland und 7,6% für die Schweiz. Übersetzt: Die restliche Welt ist bereit, Amerika in Dollar Geld zu leihen, und Amerika bekommt dafür günstige Finanzierung plus Nachfrage nach seinen Exporten. Kein anderes Land kann das, weshalb die Seite das Dollarsystem als Fundament bezeichnet.
        confidence: 9
        reference:
          - docs/5-us-casestudy/01-united-states/en.md

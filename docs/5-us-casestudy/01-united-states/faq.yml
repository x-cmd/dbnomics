    qa:
      - id: why-a-page-for-the-us
        question:
          en: Why does the US get its own page?
          cn: 为什么美国要单独一页？
          es: ¿Por qué EE. UU. tiene página propia?
          ja: なぜ米国は単独ページなのか？
          de: Warum hat die USA eine eigene Seite?
        answer:
          en: >
            Because it wears four hats at once: the largest economy by nominal GDP, the biggest debtor (government debt above 120% of GDP), the central bank of the world, and the issuer of the reserve currency. No other country plays all four roles, so there is no way to show it in a single line on someone else's chart.
          cn: >
            因为它同时戴着四顶帽子：名义 GDP 最大的经济体、最大的债务人（政府债务超过 GDP 的 120%）、世界的央行、储备货币的发行者。没有第二个国家同时扮演这四个角色，所以没法把它塞进别人图表里的一行里。
          es: >
            Porque lleva cuatro sombreros a la vez: la mayor economía por PIB nominal, el mayor deudor (deuda pública por encima del 120% del PIB), el banco central del mundo y el emisor de la moneda de reserva. Ningún otro país asume los cuatro papeles a la vez, así que no cabe en una línea del gráfico de otro.
          ja: >
            同時に 4 つの帽子をかぶっているからである。名目 GDP で最大の経済体、最大の債務者（政府債務が GDP の 120% 超）、世界の中央銀行、そして基軸通貨の発行者。この 4 つを同時に担う国はどこにもないため、他の国のグラフの 1 行には収まらない。
          de: >
            Weil sie gleichzeitig vier Hüte trägt: die größte Volkswirtschaft nach nominalem BIP, den größten Schuldner (Staatsschulden über 120% des BIP), die Zentralbank der Welt und den Emittenten der Reservewährung. Kein anderes Land besetzt alle vier Rollen, also passt es in keine Zeile eines fremden Diagramms.
        confidence: 10
        reference:
          - docs/5-us-casestudy/01-united-states/en.md
          - docs/5-us-casestudy/01-united-states/cn.md

      - id: why-is-a-deficit-normal
        question:
          en: Is a permanent government deficit normal in the US?
          cn: 美国长期财政赤字是常态吗？
          es: ¿Es normal un déficit fiscal permanente en EE. UU.?
          ja: 米国で恒常的な財政赤字は正常なのか？
          de: Ist ein dauerhaftes Haushaltsdefizit in den USA normal?
        answer:
          en: >
            Yes, on this page it is the normal state rather than the exception. Revenue stays flat around 17–19% of GDP while spending trends upward, so the gap between the green and red lines widens. The blue "net lending" line is the same story in one number: it is negative in every year shown, meaning the federal government spends more than it collects. It was −1.4% of GDP in 2001 and −7.5% in 2025.
          cn: >
            在这一页里，它确实是常态而不是例外。财政收入在 GDP 的 17–19% 附近走平，支出却一路向上，所以绿线和红线之间的缺口越拉越大。蓝色的「净借贷」线是同一件事的一个数字：图上每一年都是负的，说明联邦政府花的比收的多。2001 年是 GDP 的 −1.4%，2025 年是 −7.5%。
          es: >
            Sí: en esta página es el estado normal y no la excepción. Los ingresos se quedan planos en el 17–19% del PIB mientras el gasto tiende al alza, así que la brecha entre la línea verde y la roja se ensancha. La línea azul de «neto prestatario» es lo mismo en un solo número: es negativa en todos los años del gráfico, o sea que el gobierno federal gasta más de lo que recauda. Fue −1,4% del PIB en 2001 y −7,5% en 2025.
          ja: >
            このページでは、例外ではなく通常状態である。収入は GDP の 17–19% で横ばいなのに対し支出は上向きに傾くため、緑の線と赤の線の落差が拡大する。青い「純貸借」の線は同じことを 1 つの数字で示したもので、図のすべての年でマイナス——連邦政府は入るより支出が多い。2001 年は GDP 比 −1.4%、2025 年は −7.5% だった。
          de: >
            Ja: Auf dieser Seite ist es der Normalzustand und nicht die Ausnahme. Die Einnahmen bleiben flach bei 17–19% des BIP, während die Ausgaben nach oben tendieren — die Lücke zwischen grüner und roter Linie wächst also. Die blaue „Netto-Kreditgeber"-Linie ist dieselbe Geschichte in einer Zahl: In jedem gezeigten Jahr ist sie negativ, das heißt, der Bundeshaushalt gibt mehr aus als er einnimmt. 2001 waren es −1,4% des BIP, 2025 −7,5%.

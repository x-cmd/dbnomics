      - id: why-do-markets-tolerate-us-debt
        question:
          en: Why do markets tolerate US debt above 120% of GDP when Greece's 152% caused a crisis?
          cn: 美国债务超过 GDP 的 120% 市场却忍得住，希腊 152% 却引发了危机，为什么？
          es: ¿Por qué los mercados toleran una deuda de EE. UU. superior al 120% del PIB si la de Grecia, al 152%, provocó una crisis?
          ja: ギリシャの 152% は危機を招いたのに、米国の 120% 超は市場が許容する。なぜか？
          de: Warum dulden Märkte US-Schulden von über 120% des BIP, obwohl Griechenlands 152% eine Krise auslöste?
        answer:
          en: >
            Two reasons. First, the US issues and repays in its own currency — you cannot run out of dollars you print yourself, so the "sudden stop" that hits a euro-area borrower cannot happen. Second, the debt is owed largely to domestic savers who hold it in their own currency. That is also why the chart shows the US next to Japan (248.7%), the classic "high debt, no crisis" case, and above the EU's 60% Maastricht reference line, which is a guideline for euro-area members, not a rule for Washington.
          cn: >
            两个原因。第一，美国用本币发债、本币还债——你不会花光自己印的美元，所以欧元区借款人最怕的那种「突然断供」在美国身上不会发生。第二，这笔债务的持有者大部分是持有本币的国内储蓄者。所以图上美国和 248.7% 的日本排在一起，是典型的「高债务、无危机」案例；同时它高于欧盟 60% 的马斯特里赫特参考线——那条线是给欧元区成员的指南，不是给华盛顿的规矩。
          es: >
            Por dos razones. Primera: EE. UU. emite y repaga en su propia moneda — no puedes quedarte sin dólares que tú mismo imprimes, así que el "parón súbito" que golpea a un prestatario del euro no puede ocurrir. Segunda: buena parte de esa deuda está en manos de ahorreadores domésticos que la mantienen en su propia moneda. Por eso el gráfico coloca a EE. UU. junto a Japón (248,7%), el caso clásico de «deuda alta, sin crisis», y por encima de la línea de referencia Maastricht del 60%, que es una guía para los miembros del euro, no una norma para Washington.
          ja: >
            理由は 2 つある。第 1 に、米国は自国通貨で発行し自国通貨で返済する——自分で刷ったドルを使い切ることはないので、ユーロ圏の借入者を襲う「突然の資金途絶え」は起こりえない。第 2 に、その債務の大部分は自国通貨で保有する国内の貯蓄者が握っている。図で米国が 248.7% の日本と並ぶのは「高債務、危機なし」の古典例であり、EU の 60% のマーストリヒ卜基準線（ユーロ圏成员国向けのガイドラインであってワシントンへの規則ではない）を超えている 이유でもある。
          de: >
            Aus zwei Gründen. Erstens gibt und zurückzahlt die USA in eigener Währung — man kann nicht aus Dollar ausfallen, die man selbst druckt, sodass der „plötzliche Stopp", der einen Kreditnehmer im Euro-Raum trifft, hier nicht eintreten kann. Zweitens halten überwiegend inländische Sparer die Schuld in ihrer eigenen Währung. Deshalb steht die USA im Diagramm neben Japan (248,7%), dem klassischen Fall „hohe Schulden, keine Krise", und über der Maastricht-Referenzlinie von 60% — die ein Richtwert für Euro-Mitglieder ist, keine Vorschrift für Washington.
        confidence: 9

      - id: how-do-i-read-the-heatmap
        question:
          en: How do I read the heatmap?
          cn: 这张热力图怎么看？
          es: ¿Cómo se lee el mapa de calor?
          ja: ヒートマップはどう読むのか？
          de: Wie liest man die Heatmap?
        answer:
          en: >
            Rows are the fifty states, columns are five periods — 2000-05, 2005-10, 2010-15, 2015-20 and 2020-24 — and the colour is how fast real GDP per head grew in that period: red where it shrank, blue where it compounded. The red band in 2005-10 is the financial crisis, and it bites Nevada hardest at −2.6% a year, then Georgia at −2.1% and Michigan at −2.0%. The oil states have a different story: North Dakota ran at +3.8%, +4.8% and +5.7% a year up to 2015 and then went backwards, −2.5% a year in 2015-20, when the shale price collapsed and the drill crews left. The last column is the strongest where the jobs were: Texas +4.7% a year, Nevada +5.2%, New Mexico +5.0%. And at the bottom of the table Delaware managed −0.2%, −0.9%, +1.8%, −1.2% and +3.1% — three bad periods out of five.
          cn: >
            行是五十个州，列是五个时段——2000-05、2005-10、2010-15、2015-20 和 2020-24——颜色表示各时段实际人均 GDP 的增长速度：收缩的地方是红色，累积增长的地方是蓝色。2005-10 年那一整条红带就是金融危机，内华达州受创最重，年均 −2.6%，接着是佐治亚州 −2.1%、密歇根州 −2.0%。石油州则是另一套故事：北达科他州到 2015 年为止分别以 +3.8%、+4.8%、+5.7% 的年增速运行，随后掉头向下，在 2015-20 年年均 −2.5%，当时页岩油气价格崩了，钻井队撤走了。最后一列在有工作的地方最强：得克萨斯州年均 +4.7%，内华达州 +5.2%，新墨西哥州 +5.0%。而表格底部，特拉华州的数据是 −0.2%、−0.9%、+1.8%、−1.2% 和 +3.1%：五个时段里有三个是坏年份。
          es: >
            Las filas son los cincuenta estados, las columnas cinco periodos —2000-05, 2005-10, 2010-15, 2015-20 y 2020-24— y el color indica cómo creció el PIB real per cápita en cada periodo: rojo donde se encogió, azul donde se compuso. La franja roja de 2005-10 es la crisis financiera, y golpea con más fuerza a Nevada, con −2,6 % anual, luego Georgia con −2,1 % y Míchigan con −2,0 %. Los estados petroleros tienen otra historia: North Dakota corrió a +3,8 %, +4,8 % y +5,7 % anual hasta 2015 y luego marcha atrás, −2,5 % anual en 2015-20, cuando se hundió el precio del gas de pizarra y los equipos de perforación se fueron. La última columna es la más fuerte donde estaban los empleos: Texas +4,7 % anual, Nevada +5,2 %, New Mexico +5,0 %. Y al pie de la tabla, Delaware logró −0,2 %, −0,9 %, +1,8 %, −1,2 % y +3,1 %: tres malos periodos de cada cinco.
          ja: >
            行が 50 州、列が 5 つの時期——2000-05、2005-10、2010-15、2015-20、2020-24——で、色は各時期の実質一人当たり GDP がどれだけ成長したかを示す。縮小したところは赤、複利で積み上がったところは青だ。2005-10 年の赤い帯は金融危機で、ネバダ州が最も打撃を受け年率 −2.6%、続いてジョージア州 −2.1%、ミシガン州 −2.0%。石油州には別の物語がある。ノースダコタ州は 2015 年まで年率 +3.8%、+4.8%、+5.7% で走ったが、その後逆行し、シェール油気の価格が崩れて掘削チームが去った 2015-20 年には年率 −2.5% となった。最終列は雇用のあった場所で最も強い。テキサス州年率 +4.7%、ネバダ州 +5.2%、ニューメキシコ州 +5.0%。そして表の下端、デラウェア州は −0.2%、−0.9%、+1.8%、−1.2%、+3.1% と並ぶ。5 つの時期のうち 3 つは悪い年月だ。
          de: >
            Die Zeilen sind die fünfzig Staaten, die Spalten fünf Perioden —2000-05, 2005-10, 2010-15, 2015-20 und 2020-24—, und die Farbe zeigt, wie schnell das reale BIP pro Kopf in der jeweiligen Periode wuchs: rot, wo es schrumpfte, blau, wo es sich aufsummierte. Der rote Streifen von 2005-10 ist die Finanzkrisis, und sie beißt Nevada am härtesten mit −2,6 % pro Jahr, dann Georgia mit −2,1 % und Michigan mit −2,0 %. Die Ölstaaten haben eine andere Geschichte: North Dakota lief bis 2015 mit +3,8 %, +4,8 % und +5,7 % pro Jahr und ging dann rückwärts, −2,5 % pro Jahr in 2015-20, als der Schieferölpreis einbrach und die Bohrcrews abrückten. Die letzte Spalte ist dort am stärksten, wo die Arbeitsplätze waren: Texas +4,7 % pro Jahr, Nevada +5,2 %, New Mexico +5,0 %. Unten in der Tabelle kam Delaware auf −0,2 %, −0,9 %, +1,8 %, −1,2 % und +3,1 %: drei schlechte Perioden von fünf.

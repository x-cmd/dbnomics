    qa:
      - id: how-to-read-this-page
        question:
          en: How should I read this page?
          cn: 这一页该怎么读?
          es: ¿Cómo se lee esta página?
          ja: このページはどう読む?
          de: Wie liest man diese Seite?
        answer:
          en: >
            Five charts, in the order they affect your household: growth first (who is still expanding), then prices (did the inflation scare end), then government debt (who is paying), then China's saving-investment gap. The table at the bottom is the map: every question in it links to the page where that story is told in full.
          cn: >
            五张图,按对家庭账本的影响顺序排:先看增长(谁还在扩张),再看物价(通胀噩梦结束了没有),然后是政府债务(谁在买单),最后是中国储蓄与投资的差额。页面底部的表是地图:表里每个问题都通向那一页。
          es: >
            Cinco gráficos, en el orden en que afectan al bolsillo: primero el crecimiento (quién sigue expandiéndose), luego los precios (si se acabó el susto de la inflación), después la deuda pública (quién paga) y por último la brecha entre ahorro e inversión de China. La tabla del final es el mapa: cada pregunta enlaza a la página donde esa historia se cuenta entera.
          ja: >
            5 枚の図を、家計への-impact の順に並べます。まず成長(誰まだ伸びているか)、次に価格(インフレの噩梦は終わったか)、そして政府債務(誰が paying か)、最後に中国の储蓄と投資の差。下の表が地図で、表のどの質問も、その物語を語尽的ページへつながりっています。
          de: >
            Fünf Diagramme, in der Reihenfolge, in der sie die Haushalte treffen: zuerst das Wachstum (wer expandiert noch), dann die Preise (ist die Inflationsangst vorbei), dann die Staatsschulden (wer zahlt), zuletzt Chinas Abstand zwischen Sparen und Investieren. Die Tabelle unten ist die Landkarte: jede Frage verlinkt auf die Seite, die diese Geschichte zu Ende erzählt.
        confidence: 9
        reference:
          - docs/1-overview/02-macroeconomic-outlook/en.md
          - docs/1-overview/02-macroeconomic-outlook/cn.md

      - id: china-fast-growth-small-surplus
        question:
          en: China grows fastest yet runs the smallest surplus — how?
          cn: 中国增长最快,顺差却最小,怎么做到的?
          es: China crece más rápido y aun así su superávit es el menor, ¿cómo?
          ja: 中国は成長が最速なのに黒字は最小、どう做到的の?
          de: China wächst am schnellsten und hat trotzdem das kleinste Plus — wie?
        answer:
          en: >
            Because the surplus is a difference, not a level: what China saves minus what it invests at home. Saving fell from 50.4% of GDP in 2007 to 43.4% in 2025 while investment rose from 40.4% to 41.8%, so the gap — the trade surplus — shrank from 9.9% to 1.6%. Fast growth financed by the domestic savings of a shrinking working-age population, rather than by exports.
          cn: >
            因为顺差是个差额,不是一个水平:中国存的钱减掉在国内投的钱。储蓄从 2007 年 GDP 的 50.4% 降到 2025 年的 43.4%,投资从 40.4% 升到 41.8%,差额——也就是贸易顺差——就从 9.9% 缩到 1.6%。增长靠的是劳动年龄人口在缩的国内储蓄,不是出口。
          es: >
            Porque el superávit es una diferencia, no un nivel: lo que China ahorra menos lo que invierte dentro. El ahorro bajó del 50,4% del PIB en 2007 al 43,4% en 2025, mientras la inversión subió del 40,4% al 41,8%, así que la brecha —el superávit comercial— se redujo del 9,9% al 1,6%. Crecimiento financiado con el ahorro doméstico de una población laboral que encoge, no con las exportaciones.
          ja: >
            黒字は水準ではなく差だから。中国は国内で saving した分から投資した分を引いたものが黒字です。2007 年の GDP 比 50.4% だった储蓄が 2025 年には 43.4% に下がり、投資は 40.4% から 41.8% に上がった。差——つまり貿易黒字——は 9.9% から 1.6% に縮みました。成長を支えたのは、減る労働年齢人口の国内储蓄であって、輸出ではありません。
          de: >
            Weil das Plus eine Differenz ist, kein Niveau: Chinas Sparen minus seine Investitionen im Inland. Das Sparen fiel von 50,4% des BIP (2007) auf 43,4% (2025), die Investitionen stiegen von 40,4% auf 41,8% — die Lücke, also der Handelsüberschuss, schrumpfte von 9,9% auf 1,6%. Das Wachstum wurde aus inländischer Sparquote einer schrumpfenden Erwerbsbevölkerung finanziert, nicht aus Exporten.
        confidence: 9
        reference:
          - docs/1-overview/02-macroeconomic-outlook/en.md
          - docs/2-indicators/08-demography-savings/en.md

      - id: whose-debt-is-it
        question:
          en: Why do the US and China argue about government debt?
          cn: 美国和中国为什么总在政府债务上吵?
          es: ¿Por qué discuten EE. UU. y China por la deuda pública?
          ja: 米国と中国はなぜ政府債務で揉めるのか?
          de: Warum streiten die USA und China über die Staatsschuld?
        answer:
          en: >
            Because the number depends on what you count. China's official figure — 94% of GDP in 2025, up from 23% in 2000 — includes the financing vehicles local governments lean on, which many analysts treat as off-budget debt; a broader count pushes the number considerably higher. America has no comparable ambiguity: 124% of GDP, borrowed in its own currency and held mostly at home. Both numbers are true under their own definitions, which is exactly why the argument never ends.
          cn: >
            因为数字取决于算不算进去。中国的官方数字——2025 年 GDP 的 94%,2000 年才 23%——已经包含地方政府依赖的融资平台,不少分析师认为那属于表外债务;算法更宽,这个数就高得多。美国没有类似的模糊地带:124%,用本币借、多数握在本国投资者手里。两个数字在各自定义下都是真的——所以这架永远吵不完。
          es: >
            Porque el número depende de qué se cuente. La cifra china —94% del PIB en 2025, frente al 23% de 2000— incluye los vehículos de financiación de los gobiernos locales, que muchos analistas tratan como deuda fuera del presupuesto; un conteo más amplio la empuja bastante más arriba. América no tiene una ambigüedad comparable: 124% del PIB, prestado en su propia moneda y en manos de los estadounidenses. Ambas cifras son ciertas según sus propias definiciones, y por eso la discusión no acaba nunca.
          ja: >
            数字をどこまで数えるかで決まるからです。中国の公式値——2025 年の GDP 比 94%、2000 年は 23%——には地方政府が依存する融資平台が含まれており、多くのアナリストは予算外債務として扱います。より広く数えればさらに上振れします。アメリカに同様の曖昧さはありません。124% で、自国通貨で借り、多くは国内投資家が保有しています。どちらも自分の定義では正しく、だからこそ議論は終わらないのです。
          de: >
            Weil die Zahl davon abhängt, was man mitzählt. Die chinesische Größe — 94% des BIP 2025, nach 23% im Jahr 2000 — schließt die Finanzierungsgesellschaften der Kommunen ein, die viele Ökonomen als Budgetverschuldung außerhalb des Haushalts behandeln; zählt man breiter, liegt der Wert deutlich höher. Für Amerika gibt es diese Unschärfe nicht: 124% des BIP, aufgenommen in eigener Währung und überwiegend im Inland gehalten. Beide Zahlen stimmen nach ihrer Definition — und genau darum endet der Streit nie.
        confidence: 8
        reference:
          - docs/1-overview/02-macroeconomic-outlook/en.md
          - docs/2-indicators/05-government-debt/en.md

      - id: higher-prices-not-richer
        question:
          en: Prices are back at 2% — so why does nobody feel richer?
          cn: 物价回到 2% 了,为什么没人觉得富裕?
          es: Los precios vuelven al 2%, ¿por qué nadie se siente más rico?
          ja: 物価は 2% に戻ったのに、なぜ誰もrich を感じないのか?
          de: Die Preise sind zurück bei 2% — warum fühlt sich niemand reicher?
        answer:
          en: >
            Because a rate is a speed, not a level. When inflation ran at 8%, prices jumped about a fifth in three years; bringing inflation back to 2% stops the jump but does not undo it. Prices in 2025 sit roughly a quarter higher than in 2020 across all three economies, and that gap is what households actually live with.
          cn: >
            因为比率是速度,不是水平。通胀 8% 的时候,三年里物价跳了差不多两成;把通胀压回 2%,只是不再继续跳,并没有把跳过的还回来。2025 年的物价比 2020 年高约四分之一——这三个经济体都是如此,而这四分之一才是老百姓真正每天面对的东西。
          es: >
            Porque un ritmo es una velocidad, no un nivel. Con inflación del 8%, los precios saltaron cerca de una quinta parte en tres años; bajar la inflación al 2% detiene el salto pero no lo deshace. En 2025 los precios están cerca de un cuarto más altos que en 2020 en las tres economías, y esa es la distancia con la que viven los hogares.
          ja: >
            比率は速度であって水準ではないからです。インフレが 8% のとき、3 年で物価は 2 割近く跳ねました。インフレを 2% に戻すと跳ねが止まるだけで、跳んだ分は戻りません。2025 年の物価は 2020 年より三家とも約 4 分の 1 高い——この差こそが家が日々向き合うものです。
          de: >
            Weil eine Rate eine Geschwindigkeit ist, kein Niveau. Bei 8% Inflation sprangen die Preise in drei Jahren um etwa ein Fünftel; 2% Inflation halten den Sprung an, machen ihn aber nicht rückgängig. 2025 liegen die Preise in allen drei Volkswirtschaften rund ein Viertel höher als 2020 — und genau dieser Abstand ist es, mit dem Haushalte leben.
        confidence: 9
        reference:
          - docs/1-overview/02-macroeconomic-outlook/en.md
          - docs/2-indicators/03-inflation/en.md
